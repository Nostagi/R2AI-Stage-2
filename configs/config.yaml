dataset: "AIGuruTinix/ViFinQA"
HF_token: "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"

paths:
  raw: data/raw                  # kho .txt (financial_statements/<TICKER>/<YEAR>/<DOC>/<DOC>_extracted.txt)
  interim: data/interim          # bảng thô đã cắt khỏi .txt, chưa chuẩn hoá
  processed: data/processed      # CSV chuẩn hoá — nguồn cho evidence.csv_path
  index: data/index              # BM25 pickle + FAISS index + metadata.parquet
  questions: data/questions      # public_test.json / private_test.json
  outputs: outputs                 # outputs/<name>/ staging + outputs/submissions/*.zip
  labels: labels                 # nhãn tự gán để eval local

corpus:
  encoding: utf-8
  min_table_rows: 2              # khối ít hơn số dòng này không coi là bảng
  min_table_cols: 2
  keep_empty_tables: false

execution:
  timeout_sec: 15
  max_repair_attempts: 3
  allow_imports: [pandas, numpy, math]

submission:
  # answer bắt buộc là float; None -> điền fallback để không bị "thiếu câu"
  fallback_answer: 0.0
  csv_prefix: data/              # mọi csv_path phải bắt đầu bằng đây
  round_to: 2
